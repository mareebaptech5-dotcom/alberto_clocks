<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta
      name="description"
      content="The requested page could not be found. Browse Alberto Clocks watch collections or return to the homepage."
    />
    <meta name="theme-color" content="#27060b" />
    <title>Page Not Found | Alberto Clocks</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="https://mareebaptech5-dotcom.github.io/alberto_clocks/"
    />
    <style>
      :root {
        color-scheme: dark;
        --wine: #27060b;
        --wine-light: #650f1d;
        --gold: #d8b66a;
        --cream: #f8f4eb;
        --muted: #d6c9c4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(ellipse at 50% 30%, rgba(101, 15, 29, 0.9), transparent 58%),
          var(--wine);
        color: var(--cream);
        font-family: Arial, sans-serif;
        text-align: center;
      }

      main {
        width: min(100%, 620px);
        padding: clamp(32px, 7vw, 64px);
        border: 1px solid rgba(216, 182, 106, 0.36);
        border-radius: 24px;
        background: rgba(15, 3, 5, 0.42);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 30px;
        color: var(--cream);
        font-family: Georgia, serif;
        font-size: 1rem;
        letter-spacing: 0.08em;
        text-decoration: none;
      }

      .brand img {
        display: block;
        width: 52px;
        height: 35px;
        object-fit: contain;
      }

      .error-code {
        margin: 0;
        color: var(--gold);
        font-family: Georgia, serif;
        font-size: clamp(5rem, 22vw, 9rem);
        font-weight: 400;
        letter-spacing: 0.04em;
        line-height: 0.95;
      }

      h1 {
        margin: 20px 0 12px;
        font-family: Georgia, serif;
        font-size: clamp(1.7rem, 6vw, 2.5rem);
        font-weight: 400;
      }

      .message {
        margin: 0 auto;
        max-width: 430px;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.7;
      }

      .actions {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 30px;
      }

      .actions a {
        min-width: 150px;
        padding: 13px 20px;
        border: 1px solid var(--gold);
        border-radius: 999px;
        color: var(--gold);
        font-weight: 700;
        text-decoration: none;
        transition: background-color 180ms ease, color 180ms ease, transform 180ms ease;
      }

      .actions a:hover,
      .actions a:focus-visible {
        transform: translateY(-2px);
        background: var(--gold);
        color: var(--wine);
      }

      .actions a:focus-visible,
      .brand:focus-visible {
        outline: 3px solid var(--cream);
        outline-offset: 4px;
      }

      .actions .primary {
        background: var(--gold);
        color: var(--wine);
      }

      .actions .primary:hover,
      .actions .primary:focus-visible {
        background: var(--cream);
        border-color: var(--cream);
      }

      @media (max-width: 420px) {
        body {
          padding: 16px;
        }

        main {
          padding: 32px 22px;
        }

        .actions {
          flex-direction: column;
        }

        .actions a {
          width: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <a
        class="brand"
        href="https://aptechabdulhadi-cmyk.github.io/E-project-final-13/"
        aria-label="Alberto Clocks home"
      >
        <img
          src="https://aptechabdulhadi-cmyk.github.io/E-project-final-13/logo.png"
          alt=""
          width="52"
          height="35"
        />
        <span>ALBERTO CLOCKS</span>
      </a>
      <p class="error-code" aria-hidden="true">404</p>
      <h1>We can’t find that page</h1>
      <p class="message">
        The page may have moved or the address may be incorrect. Explore our
        watch collections or return to the Alberto Clocks homepage.
      </p>
      <nav class="actions" aria-label="Helpful links">
        <a class="primary" href="https://aptechabdulhadi-cmyk.github.io/E-project-final-13/">Go to homepage</a>
        <a href="https://aptechabdulhadi-cmyk.github.io/E-project-final-13/collections.html">Browse collections</a>
      </nav>
    </main>
  </body>
</html>
